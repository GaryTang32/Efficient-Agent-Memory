<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 294" width="960" height="294" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">SWE-bench Verified: 100 Django issues at a 16K window, same-day runs</title><desc id="d">Cost relative to the ceiling with 95% intervals and issues resolved, for Haiku and Sonnet. On Sonnet the lean settings cost 82 to 86% of the ceiling; on Haiku 89 to 92% with intervals that include 100%. The adaptive workspace costs more. Every setting resolves within a few issues of the ceiling.</desc><text x="20" y="26" fill="#f0efec" font-size="14" font-weight="600">SWE-bench Verified, 100 Django issues at a 16K window: cost against the ceiling, all settings run on the same day</text><text x="20" y="46" fill="#c3c2b7" font-size="12.5">Dot: cost as a share of the ceiling's. Line: 95% interval over workdays. Right: issues resolved of 100.</text><text x="172" y="78" fill="#f0efec" font-size="13.5" font-weight="600">Claude Haiku<tspan fill="#9b9990" font-weight="400">  ·  the ceiling resolves 77</tspan></text><line x1="172.0" x2="172.0" y1="92" y2="244" stroke="#2c2c2a" stroke-width="1"/><text x="172.0" y="261" fill="#9b9990" font-size="11.5" text-anchor="middle">50%</text><line x1="220.1" x2="220.1" y1="92" y2="244" stroke="#2c2c2a" stroke-width="1"/><text x="220.1" y="261" fill="#9b9990" font-size="11.5" text-anchor="middle">75%</text><line x1="268.2" x2="268.2" y1="92" y2="244" stroke="#2c2c2a" stroke-width="1"/><text x="268.2" y="261" fill="#9b9990" font-size="11.5" text-anchor="middle">100%</text><line x1="316.2" x2="316.2" y1="92" y2="244" stroke="#2c2c2a" stroke-width="1"/><text x="316.2" y="261" fill="#9b9990" font-size="11.5" text-anchor="middle">125%</text><line x1="364.3" x2="364.3" y1="92" y2="244" stroke="#2c2c2a" stroke-width="1"/><text x="364.3" y="261" fill="#9b9990" font-size="11.5" text-anchor="middle">150%</text><line x1="412.4" x2="412.4" y1="92" y2="244" stroke="#2c2c2a" stroke-width="1"/><text x="412.4" y="261" fill="#9b9990" font-size="11.5" text-anchor="middle">175%</text><line x1="268.2" x2="268.2" y1="88" y2="244" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 4"/><text x="160" y="115.0" fill="#f0efec" font-size="12.5" text-anchor="end">Lean (ReSum summary)</text><line x1="212.4" x2="297.0" y1="111.0" y2="111.0" stroke="#3987e5" stroke-width="2.5" stroke-linecap="round" opacity="0.55"><title>Lean (ReSum summary), Claude Haiku: 92% of the ceiling's cost (95% interval 71–115%), 80 of 100 resolved</title></line><circle cx="252.8" cy="111.0" r="5.5" fill="#3987e5" stroke="#0d1117" stroke-width="2"><title>Lean (ReSum summary), Claude Haiku: 92% of the ceiling's cost (95% interval 71–115%), 80 of 100 resolved</title></circle><text x="252.8" y="101.0" fill="#c3c2b7" font-size="11.5" text-anchor="middle">92%</text><text x="436" y="115.0" fill="#f0efec" font-size="12.5">80</text><text x="160" y="153.0" fill="#f0efec" font-size="12.5" text-anchor="end">Lean + handoff recap</text><line x1="208.5" x2="302.8" y1="149.0" y2="149.0" stroke="#3987e5" stroke-width="2.5" stroke-linecap="round" opacity="0.55"><title>Lean + handoff recap, Claude Haiku: 89% of the ceiling's cost (95% interval 69–118%), 79 of 100 resolved</title></line><circle cx="247.0" cy="149.0" r="5.5" fill="#3987e5" stroke="#0d1117" stroke-width="2"><title>Lean + handoff recap, Claude Haiku: 89% of the ceiling's cost (95% interval 69–118%), 79 of 100 resolved</title></circle><text x="247.0" y="139.0" fill="#c3c2b7" font-size="11.5" text-anchor="middle">89%</text><text x="436" y="153.0" fill="#f0efec" font-size="12.5">79</text><text x="160" y="191.0" fill="#f0efec" font-size="12.5" text-anchor="end">Lean + brief recap</text><line x1="216.2" x2="287.4" y1="187.0" y2="187.0" stroke="#3987e5" stroke-width="2.5" stroke-linecap="round" opacity="0.55"><title>Lean + brief recap, Claude Haiku: 90% of the ceiling's cost (95% interval 73–110%), 75 of 100 resolved<