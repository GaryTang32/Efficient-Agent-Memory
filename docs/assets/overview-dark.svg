<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 614" width="960" height="614" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">What Efficient Agent Memory does</title><desc id="d">The problem: context grows, long tasks fail at the window, nothing carries over between sessions, and trimming history can cost more because it breaks the prompt cache. The repo measures 27 methods the same way and ships the best as AutoMemory (recall, previews, an overflow guard, one reset at 75% of the window, autosave). Users get the full-context agent's accuracy at 58-85% of its cost, about 35% of its peak prompt, as many real bugs fixed in a 16K window, and notes wrapped against injected instructions.</desc><text x="20" y="30" fill="#f0efec" font-size="17" font-weight="700">Efficient Agent Memory</text><text x="20" y="52" fill="#c3c2b7" font-size="13">Make long-running LLM agents cheaper and leaner, with no loss of accuracy.</text><text x="20" y="82" fill="#9b9990" font-size="11.5" font-weight="600" letter-spacing="1">THE PROBLEM</text><text x="345" y="82" fill="#9b9990" font-size="11.5" font-weight="600" letter-spacing="1">WHAT THE REPO DOES</text><text x="670" y="82" fill="#9b9990" font-size="11.5" font-weight="600" letter-spacing="1">WHAT YOU GET</text><rect x="20" y="92" width="270" height="98" rx="8" fill="#161b22" stroke="#2c2c2a"/><rect x="20" y="98" width="3.5" height="86" rx="1.75" fill="#d95926"/><text x="36" y="124" fill="#f0efec" font-size="13.5" font-weight="600">Context keeps growing</text><text x="36" y="147" fill="#c3c2b7" font-size="12.5">Every tool output is re-sent on every</text><text x="36" y="164" fill="#c3c2b7" font-size="12.5">call, so a long task fills the window.</text><rect x="20" y="202" width="270" height="98" rx="8" fill="#161b22" stroke="#2c2c2a"/><rect x="20" y="208" width="3.5" height="86" rx="1.75" fill="#d95926"/><text x="36" y="234" fill="#f0efec" font-size="13.5" font-weight="600">Long tasks fail at the window</text><text x="36" y="257" fill="#c3c2b7" font-size="12.5">The agent stops or loses track</text><text x="36" y="274" fill="#c3c2b7" font-size="12.5">before the fix is in.</text><rect x="20" y="312" width="270" height="98" rx="8" fill="#161b22" stroke="#2c2c2a"/><rect x="20" y="318" width="3.5" height="86" rx="1.75" fill="#d95926"/><text x="36" y="344" fill="#f0efec" font-size="13.5" font-weight="600">Nothing carries over</text><text x="36" y="367" fill="#c3c2b7" font-size="12.5">Each new session starts from zero</text><text x="36" y="384" fill="#c3c2b7" font-size="12.5">and redoes the same exploration.</text><rect x="20" y="422" width="270" height="98" rx="8" fill="#161b22" stroke="#2c2c2a"/><rect x="20" y="428" width="3.5" height="86" rx="1.75" fill="#d95926"/><text x="36" y="454" fill="#f0efec" font-size="13.5" font-weight="600">Saving tokens can cost more</text><text x="36" y="477" fill="#c3c2b7" font-size="12.5">Cached history is re-sent at 0.05–0.1×;</text><text x="36" y="494" fill="#c3c2b7" font-size="12.5">rewriting it is billed at 1.25–2×.</text><rect x="670" y="92" width="270" height="98" rx="8" fill="#161b22" stroke="#2c2c2a"/><rect x="670" y="98" width="3.5" height="86" rx="1.75" fill="#3987e5"/><text x="686" y="122" fill="#3987e5" font-size="22" font-weight="700">58–85%</text><text x="686" y="142" fill="#f0efec" font-size="13" font-weight="600">of the cost, same accuracy</text><text x="686" y="162" fill="#c3c2b7" font-size="12">Matches the full-context agent on long</text><text x="686" y="179" fill="#c3c2b7" font-size="12">tasks (Sonnet 58%, Haiku 85%).</text><rect x="670" y="202" width="270" height="98" rx="8" fill="#161b22" stroke="#2c2c2a"/><rect x="670" y="208" width="3.5" height="86" rx="1.75" fill="#3987e5"/><text x="686" y="232" fill="#3987e5" font-size="22" font-weight="700">~35%</text><text x="686" y="252" fill="#f0efec" font-size="13" font-weight="600">of the peak prompt</text><text x="686" y="272" fill="#c3c2b7" font-size="12">The largest prompt sent is about a</text><text x="686" y="289" fill="#c3c2b7" font-size="12">third of the full-context agent's.</text><rect x="670" y="312" width="270" height="98" rx="8" fill="#161b22" stroke="#2c2c2a"/><rect x="670" y="318" width="3.5" height="86" rx="1.75" fill="#3987e5"/><text x="686" y="342" fill="#3987e5" font-size="22" font-weight="700">16K</text><text x="686" y="362" fill="#f0efec" font-size="13" font-weight="600">window, same issues fixed</text><text x="686" y="382" fill="#c3c2b7" font-size="12">Real Django bugs: as many fixed as with</text><text x="686" y="399" fill="#c3c2b7" font-size="12">the full window, 80% cost on Sonnet.</text><rect x="670" y="422" width="270" height="98" rx="8" fill="#161b22" stroke="#2c2c2a"/><rect x="670" y="428" width="3.5" height="86" rx="1.75" fill="#3987e5"/><text x="686" y="452" fill="#3987e5" font-size="22" font-weight="700">0 / 20</text><text x="686" y="472" fill="#f0efec" font-size="13" font-weight="600">planted instructions obeyed</text><text x="686" y="492" fill="#c3c2b7" font-size="12">Notes are wrapped as data (4 of 20</text><text x="686" y="509" fill="#c3c2b7" font-size="12">were obeyed unwrapped).</text><rect x="335" y="88" width="290" height="436" rx="12" fill="#13233a"/><rect x="349" y="100" width="262" height="112" rx="8" fill="#161b22" stroke="#2c2c2a"/><text x="363" y="124" fill="#f0efec" font-size="13.5" font-weight="600">1 · Test bench</text><text x="363" y="145" fill="#c3c2b7" font-size="12">27 methods and variants from papers,</text><text x="363" y="162" fill="#c3c2b7" font-size="12">about 3,700 runs on Claude Haiku and</text><text x="363" y="179" fill="#c3c2b7" font-size="12">Sonnet, each between the same floor</text><text x="363" y="196" fill="#c3c2b7" font-size="12">(no memory) and ceiling (full context).</text><rect x="349" y="224" width="262" height="174" rx="8" fill="#161b22" stroke="#2c2c2a"/><text x="363" y="248" fill="#f0efec" font-size="13.5" font-weight="600">2 · AutoMemory</text><text x="363" y="269" fill="#c3c2b7" font-size="12">The best methods, combined. It never</text><text x="363" y="286" fill="#c3c2b7" font-size="12">rewrites cached history each step:</text><circle cx="369" cy="302" r="3.5" fill="#3987e5"/><text x="381" y="306" fill="#f0efec" font-size="12">recall notes at session start</text><circle cx="369" cy="322" r="3.5" fill="#3987e5"/><text x="381" y="326" fill="#f0efec" font-size="12">preview large outputs</text><circle cx="369" cy="342" r="3.5" fill="#3987e5"/><text x="381" y="346" fill="#f0efec" font-size="12">guard against overflow</text><circle cx="369" cy="362" r="3.5" fill="#3987e5"/><text x="381" y="366" fill="#f0efec" font-size="12">one reset at 75% of the window</text><circle cx="369" cy="382" r="3.5" fill="#3987e5"/><text x="381" y="386" fill="#f0efec" font-size="12">autosave the answer as a note</text><rect x="349" y="410" width="262" height="102" rx="8" fill="#161b22" stroke="#2c2c2a"/><text x="363" y="434" fill="#f0efec" font-size="13.5" font-weight="600">Install it your way</text><text x="363" y="455" fill="#c3c2b7" font-size="12">Python library · MCP server · Claude</text><text x="363" y="472" fill="#c3c2b7" font-size="12">Code plugin · no runtime dependencies</text><path d="M298 306.0 h16 M308 300.0 l6 6 l-6 6" fill="none" stroke="#9b9990" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M633 306.0 h16 M643 300.0 l6 6 l-6 6" fill="none" stroke="#9b9990" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="546" width="920" height="52" rx="8" fill="#161b22" stroke="#2c2c2a"/><text x="36" y="568" fill="#f0efec" font-size="13" font-weight="600">The core lesson: fewer tokens is not fewer dollars.</text><text x="36" y="586" fill="#c3c2b7" font-size="12">Cached history is cheap to re-send. The methods that pay off act when an output arrives or at a rare reset; trimming every step cost up to 6×.</text></svg>
