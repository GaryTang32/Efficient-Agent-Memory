<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 698" width="960" height="698" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Roadmap and progress of Efficient Agent Memory</title><desc id="d">5 of 6 stages are done: measuring published methods, building AutoMemory, real repositories, shipping a Claude Code plugin, and a validation round. Next: broaden to native tool calls on Bedrock and GPT models (blocked on credentials), three runs on SymPy, cost on two price bases, and a repository outside Python.</desc><text x="20" y="28" fill="#f0efec" font-size="15" font-weight="600">Roadmap and progress</text><text x="20" y="49" fill="#c3c2b7" font-size="12.5">5 of 6 stages done · 22 Oct – 13 Nov 2026 · about 3,700 benchmark runs on Claude Haiku and Sonnet</text><rect x="20" y="64" width="128" height="8" rx="4" fill="#3987e5" opacity="1"/><rect x="154" y="64" width="128" height="8" rx="4" fill="#3987e5" opacity="1"/><rect x="288" y="64" width="128" height="8" rx="4" fill="#3987e5" opacity="1"/><rect x="422" y="64" width="128" height="8" rx="4" fill="#3987e5" opacity="1"/><rect x="556" y="64" width="128" height="8" rx="4" fill="#3987e5" opacity="1"/><rect x="690" y="64" width="128" height="8" rx="4" fill="#d95926" opacity="0.85"/><circle cx="842" cy="68" r="6" fill="#3987e5" stroke="#0d1117" stroke-width="2"/><path d="M838.4 68.2 l2.5 2.6 l4.8 -5.2" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="854" y="72" fill="#c3c2b7" font-size="12">done</text><circle cx="902" cy="68" r="6" fill="#0d1117" stroke="#d95926" stroke-width="2.5"/><circle cx="902" cy="68" r="1.5" fill="#d95926"/><text x="914" y="72" fill="#c3c2b7" font-size="12">next</text><line x1="136" x2="136" y1="104" y2="368" stroke="#3987e5" stroke-width="3" stroke-linecap="round"/><line x1="136" x2="136" y1="368" y2="440" stroke="#4a4a46" stroke-width="2" stroke-dasharray="4 4"/><text x="118" y="116" fill="#c3c2b7" font-size="12" text-anchor="end">22–26 Oct</text><circle cx="136" cy="112" r="7.5" fill="#3987e5" stroke="#0d1117" stroke-width="2"/><path d="M132.4 112.2 l2.5 2.6 l4.8 -5.2" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="162" y="117" fill="#f0efec" font-size="14" font-weight="600"><tspan fill="#9b9990" font-weight="400">1  </tspan>Measure published methods</text><text x="162" y="136" fill="#c3c2b7" font-size="12.5">ReSum, AgentDiet, Context-Folding, MemoryOS, LightMem, Nemori and others on four long multi-session tasks</text><text x="162" y="154" fill="#f0efec" font-size="12.5"><tspan fill="#3987e5" font-weight="600">→ </tspan>No single method is enough; plain notes beat engineered memory systems</text><text x="118" y="180" fill="#c3c2b7" font-size="12" text-anchor="end">23 Oct – 5 Nov</text><circle cx="136" cy="176" r="7.5" fill="#3987e5" stroke="#0d1117" stroke-width="2"/><path d="M132.4 176.2 l2.5 2.6 l4.8 -5.2" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="162" y="181" fill="#f0efec" font-size="14" font-weight="600"><tspan fill="#9b9990" font-weight="400">2  </tspan>Build AutoMemory</text><text x="162" y="200" fill="#c3c2b7" font-size="12.5">v1, then v2 after eight more methods from the 2026 literature; a Python library and an MCP server</text><text x="162" y="218" fill="#f0efec" font-size="12.5"><tspan fill="#3987e5" font-weight="600">→ </tspan>v2 reaches the ceiling's accuracy at 85% (Haiku) and 58% (Sonnet) of its cost</text><text x="118" y="244" fill="#c3c2b7" font-size="12" text-anchor="end">5–6 Nov</text><circle cx="136" cy="240" r="7.5" fill="#3987e5" stroke="#0d1117" stroke-width="2"/><path d="M132.4 240.2 l2.5 2.6 l4.8 -5.2" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="162" y="245" fill="#f0efec" font-size="14" font-weight="600"><tspan fill="#9b9990" font-weight="400">3  </tspan>Real repositories</text><text x="162" y="264" fill="#c3c2b7" font-size="12.5">SWE-bench Verified workdays on Django, graded with the official tests; NVIDIA's handoff recap</text><text x="162" y="282" fill="#f0efec" font-size="12.5"><tspan fill="#3987e5" font-weight="600">→ </tspan>A 16K window with compaction resolves as many issues as the model's full window</text><text x="118" y="308" fill="#c3c2b7" font-size="12" text-anchor="end">8 Nov</text><circle cx="136" cy="304" r="7.5" fill="#3987e5" stroke="#0d1117" stroke-width="2"/><path d="M132.4 304.2 l2.5 2.6 l4.8 -5.2" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="162" y="309" fill="#f0efec" font-size="14" font-weight="600"><tspan fill="#9b9990" font-weight="400">4  </tspan>Ship to users</text><text x="162" y="328" fill="#c3c2b7" font-size="12.5">Claude Code plugin (previews, handoff at compaction, recall, autosave) and two pilots</text><text x="162" y="346" fill="#f0efec" font-size="12.5"><tspan fill="#3987e5" font-weight="600">→ </tspan>Neutral inside Claude Code, which already caches and compacts</text><text x="118" y="372" fill="#c3c2b7" font-size="12" text-anchor="end">8–13 Nov</text><circle cx="136" cy="368" r="7.5" fill="#3987e5" stroke="#0d1117" stroke-width="2"/><path d="M132.4 368.2 l2.5 2.6 l4.8 -5.2" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="162" y="373" fill="#f0efec" font-size="14" font-weight="600"><tspan fill="#9b9990" font-weight="400">5  </tspan>Validate</text><text x="162" y="392" fill="#c3c2b7" font-size="12.5">Same-day controls, repeats, a code audit, SymPy and related issues, three runs per cell</text><text x="162" y="410" fill="#f0efec" font-size="12.5"><tspan fill="#3987e5" font-weight="600">→ </tspan>Headline results hold; lean costs 80% of the ceiling on Sonnet; four claims withdrawn</text><text x="118" y="436" fill="#9b9990" font-size="12" text-anchor="end">next</text><circle cx="136" cy="432" r="7.5" fill="#0d1117" stroke="#d95926" stroke-width="2.5"/><circle cx="136" cy="432" r="3.0" fill="#d95926"/><text x="162" y="437" fill="#f0efec" font-size="14" font-weight="600"><tspan fill="#9b9990" font-weight="400">6  </tspan>Broaden</text><text x="162" y="456" fill="#c3c2b7" font-size="12.5">Native tool calls on Bedrock, GPT models, a second language, three runs on SymPy</text><text x="162" y="474" fill="#f0efec" font-size="12.5"><tspan fill="#d95926" font-weight="600">→ </tspan>Bedrock and GPT wait on credentials; the rest needs no new access</text><line x1="20" x2="940" y1="506" y2="506" stroke="#2c2c2a" stroke-width="1"/><text x="20" y="536" fill="#f0efec" font-size="14" font-weight="600">What is left</text><circle cx="28.0" cy="562" r="6.5" fill="#0d1117" stroke="#d95926" stroke-width="2.5"/><circle cx="28.0" cy="562" r="2.0" fill="#d95926"/><text x="42.0" y="566.5" fill="#f0efec" font-size="13" font-weight="600">Next</text><text x="42.0" y="592" fill="#f0efec" font-size="12.5">Three runs of SymPy and related issues</text><text x="42.0" y="608" fill="#9b9990" font-size="11.5">≈ $45</text><text x="42.0" y="630" fill="#f0efec" font-size="12.5">Cost on two price bases</text><text x="42.0" y="646" fill="#9b9990" font-size="11.5">no API cost</text><text x="42.0" y="668" fill="#f0efec" font-size="12.5">Plugin for agents without built-in caching</text><text x="42.0" y="684" fill="#9b9990" font-size="11.5">no API cost</text><circle cx="334.6666666666667" cy="562" r="6.5" fill="#0d1117" stroke="#898781" stroke-width="2"/><line x1="330.6666666666667" y1="566" x2="338.6666666666667" y2="558" stroke="#898781" stroke-width="2" stroke-linecap="round"/><text x="348.6666666666667" y="566.5" fill="#f0efec" font-size="13" font-weight="600">Blocked on credentials</text><text x="348.6666666666667" y="592" fill="#f0efec" font-size="12.5">Bedrock validation, native tool calls</text><text x="348.6666666666667" y="608" fill="#9b9990" font-size="11.5">AWS key</text><text x="348.6666666666667" y="630" fill="#f0efec" font-size="12.5">GPT and other non-Claude models</text><text x="348.6666666666667" y="646" fill="#9b9990" font-size="11.5">API key</text><circle cx="641.3333333333334" cy="562" r="6.5" fill="#0d1117" stroke="#898781" stroke-width="2" stroke-dasharray="3 2.5"/><text x="655.3333333333334" y="566.5" fill="#f0efec" font-size="13" font-weight="600">Not started</text><text x="655.3333333333334" y="592" fill="#f0efec" font-size="12.5">Codex / OpenAI re-pricing</text><text x="655.3333333333334" y="608" fill="#9b9990" font-size="11.5">no API cost</text><text x="655.3333333333334" y="630" fill="#f0efec" font-size="12.5">A repository outside Python</text><text x="655.3333333333334" y="646" fill="#9b9990" font-size="11.5">needs its own test setup</text></svg>
